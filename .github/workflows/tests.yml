name: brew test-bot
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test-bot:
    strategy:
      # One platform failing shouldn't cancel the others — we want the full
      # picture of which platforms build.
      fail-fast: false
      matrix:
        # macos-15 is arm64; macos-15-intel is x86_64. ubuntu-24.04-arm is still
        # a GitHub public-preview runner.
        #
        # macos-15-intel cannot produce a bottle and warns "has unbottled
        # dependencies" every run. That is not our bug: homebrew-core has all
        # but abandoned Intel Sequoia (81 formulae carry a `sequoia` bottle vs
        # 7219 carrying `sonoma`), and `node` is not one of them. test-bot
        # requires build/runtime deps to be bottled for the *exact* current tag
        # — `no_older_versions: !dep.test?` in test_bot/formulae.rb — so node's
        # `sonoma` bottle does not satisfy it even though users on Intel Sequoia
        # do get poured that bottle at install time.
        # Kept deliberately for now. To actually bottle Intel macOS we would need
        # an Intel *Sonoma* runner (macos-14-large), which is a billed larger
        # runner. The leg still returns before the spike's install/test, so its
        # coverage comes from the contensis-cli step at the bottom: installing the
        # x86_64 macOS release asset is the one check only this leg can make, and
        # Intel Mac users install that formula.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        # Pinned to a CalVer release tag, not a floating ref: Homebrew deprecated
        # `@master`/`@main`, the `master` branch sync has stopped, and it becomes a
        # hard error at Homebrew 5.2.0. Tags point at commits on `main` and are
        # never moved. 2026.09.28.1 = e99025eb970cfa124b8284a35463d87426917478: it
        # drops the `setup-sandbox` input this step never passed, adds a `tap-name`
        # output, and still exports the gems-path/gems-hash outputs used below.
        # Keep publish.yml pinned to the same tag.
        uses: Homebrew/actions/setup-homebrew@2026.09.28.1

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        # v4 runs on node20, which GitHub has deprecated and now force-runs on
        # node24; v5+ target node24 natively. Inputs are unchanged.
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          # runner.arch is required, not cosmetic: runner.os is 'Linux' for both
          # ubuntu-24.04 and ubuntu-24.04-arm (and 'macOS' for both Mac legs), so
          # without it the two architectures overwrite each other's cache.
          key: ${{ runner.os }}-${{ runner.arch }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      # GitHub's Intel macOS image ships with `aws/tap` already tapped, which makes
      # every subsequent brew command warn "Skipping aws/tap because it is not
      # trusted". Untap rather than trust it: we do not use it, so there is no
      # reason to mark a third-party tap trusted, and HOMEBREW_NO_REQUIRE_TAP_TRUST
      # is deprecated upstream and would switch the check off for the whole job —
      # including for our own tap. Scoped to the leg that has the problem, so it
      # cannot silently start masking one elsewhere; `|| true` covers an image that
      # stops shipping the tap.
      - name: Untap aws/tap (pre-tapped on the Intel macOS image)
        if: matrix.os == 'macos-15-intel'
        run: brew untap aws/tap || true

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # TEMPORARY Phase 0 gate: bottle ONLY the spike. Once the npm build is
      # promoted to the sole `contensis-cli` formula (Phase 2) and the binary
      # formula is removed, drop `--testing-formulae contensis-cli-spike` again and
      # let plain detection (`--only-formulae`) decide what to build. This gate
      # keeps the `pkg`-built binary formula out of the bottle path — bottling it
      # corrupts the binary on Linux (patchelf) — while still exercising the full
      # bottle/publish flow now.
      #
      # --root-url is NOT optional for this tap. Left to itself, test-bot points a
      # third-party tap's bottles at
      #   <remote>/releases/download/<formula>-<version>
      # which is version-pinned, and routes publishing to GitHub Releases. That is
      # the exact `root_url` shape that went stale here in 2023/24 and had to be
      # ripped out (4eea075, 10d4b96). Pointing at ghcr.io instead gives a
      # version-independent root_url and routes `brew pr-pull` through GitHub
      # Packages, which is what publish.yml is already configured for.
      # Shape is fixed by Homebrew: https://ghcr.io/v2/<owner>/<tap-without-homebrew->
      - name: Build bottles
        if: github.event_name == 'pull_request'
        # pipefail is not optional here: GitHub's default `bash -e` has no
        # pipefail, so `brew test-bot … | tee` would report tee's status and the
        # step could never fail.
        shell: bash
        run: |
          set -euo pipefail
          brew test-bot --only-formulae --testing-formulae contensis-cli-spike \
            --root-url=https://ghcr.io/v2/contensis/cli 2>&1 | tee test-bot.log

      # test-bot exits 0 when it ignores a failed step, and on a version bump it
      # always will: `ignore_failures = … && !bottled_on_current_version` in
      # test_bot/formulae.rb, and the version being bumped has no bottle yet by
      # definition. The PR #35 run for 1.7.1 printed
      #   ==> Skipped or failed formulae: contensis-cli-spike
      #   Warning: 1 failed step ignored!
      # and went green. Match the warning rather than the exit code, so the
      # annotation names the cause instead of just "no bottles uploaded".
      - name: Fail on a test-bot failure it exited zero on
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ -f test-bot.log ] && grep -q "failed step ignored" test-bot.log; then
            echo "::error::brew test-bot exited 0 after ignoring a failed step"
            exit 1
          fi

      # The formula users actually install, and the one nothing above touches:
      # the gate bottles only the spike, so contensis-cli.rb otherwise gets
      # style/audit alone. A plain `brew install` keeps it out of test-bot's
      # bottle path on purpose — patchelf corrupts the pkg-built binary, which is
      # why the spike-only gate exists.
      #
      # This is what catches a half-bump. The formula carries four url/sha256
      # pairs and bump tooling only ever sees one of them, so a stale pair shows
      # up here as a checksum mismatch or a failed `--version` assertion on the
      # platform it affects, instead of on a user's machine weeks later. It is
      # also the first CI exercise of the `on_macos { if Hardware::CPU.arm? }`
      # branch: each leg resolves the asset for its own platform.
      #
      # No `brew tap`/`brew trust` needed — setup-homebrew checks this repository
      # out as the tap and trusts it (setup-homebrew main.sh:
      # `brew trust "$HOMEBREW_TAP_NAME"`). HOMEBREW_NO_INSTALL_FROM_API makes
      # brew read the tap rather than the API, which is what test-bot does too.
      #
      # HOMEBREW_NO_PATH_SHADOW_CHECK is not cosmetic. The bottle step above
      # installs the spike to build it, and the spike provides the same two names,
      # so the shadow check sees `/opt/homebrew/bin/contensis-cli ->
      # Cellar/contensis-cli-spike/…` and fails the install outright — even though
      # the formula itself poured fine. That is expected coexistence between these
      # two formulae, not a broken install, and it only bites the legs that bottle:
      # macos-15-intel skips the spike, so it never shadows and passed. The test
      # block is unaffected either way — `bin` in a test is the formula's own
      # Cellar bin, not the shadowed shim.
      - name: Install and test contensis-cli
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1
          HOMEBREW_NO_PATH_SHADOW_CHECK: 1
        run: |
          brew install --formula contensis-cli
          brew test contensis-cli

      - name: Upload bottles as artifact
        # macos-15-intel cannot bottle (see the matrix comment), so it is excluded
        # rather than tolerated: with `if-no-files-found: ignore` on every leg, a
        # bottling leg that produced nothing still went green. test-bot does that
        # on purpose — `ignore_failures = ... && !bottled_on_current_version` in
        # test_bot/formulae.rb means the first PR for a new version has no bottle
        # to compare against, so a failed install is downgraded to
        # "Warning: 1 failed step ignored!" and the step exits 0. This is the
        # outside check that catches it: no bottle file on a leg that must bottle
        # is now a hard failure.
        if: always() && github.event_name == 'pull_request' && matrix.os != 'macos-15-intel'
        # Pinned to a release major rather than @main: `main` is an unpinned
        # development branch, not a supported ref. v7 targets node24.
        uses: actions/upload-artifact@v7
        with:
          # Must be unique per matrix leg — upload-artifact v4+ rejects a
          # repeated name within a run. `brew pr-pull` downloads every artifact
          # from the run, so the suffix doesn't affect publishing.
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: error
