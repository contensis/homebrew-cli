name: brew pr-pull
on:
  pull_request_target:
    types:
      - labeled
jobs:
  pr-pull:
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')
    runs-on: ubuntu-24.04
    # Explicit, because the default GITHUB_TOKEN permissions are read-only on
    # repositories created or reconfigured since 2023. Without these the job fails
    # late, at the push or the bottle upload, rather than up front.
    #   contents: write      — cherry-pick the PR commits and push them to main
    #   packages: write      — upload bottles to ghcr.io (see tests.yml --root-url)
    #   pull-requests: write — close the PR and comment on it
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      # All three Homebrew/actions refs are pinned to a CalVer release tag,
      # matching tests.yml. `@master` is dead: homebrew/actions has no `master`
      # branch any more, so every pr-pull run died before its first step with
      #   Unable to resolve action `homebrew/actions@master`, unable to find
      #   version `master`
      # which meant no labelled PR could ever be bottled or merged.
      #
      # Tags point straight at commits on `main` and are never moved (see the
      # Releases section of homebrew/actions/README.md), so this does not float.
      # `@main` would resolve, but this job runs on pull_request_target with
      # contents/packages write — the last place that wants a moving ref.
      # 2026.09.28.1 = e99025eb970cfa124b8284a35463d87426917478. Bump both this
      # file and tests.yml together.
      #
      # NOTE: `pull_request_target` reads this file from the BASE branch, so a
      # change here only takes effect once it is on main. Land it first, then
      # (re)add the `pr-pull` label to the release PR.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.09.28.1

      - name: Set up git
        uses: Homebrew/actions/git-user-config@2026.09.28.1

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@2026.09.28.1
        with:
          token: ${{ github.token }}
          branch: main

      - name: Delete branch
        if: github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push --delete origin "$BRANCH"
